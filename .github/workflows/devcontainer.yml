name: Build and publish dev container

on:
  push:
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build dev container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Determine image tags
        id: tags
        shell: bash
        run: |
          tags="sha-${GITHUB_SHA}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            branch="${GITHUB_REF#refs/heads/}"
            branch_tag="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g' | cut -c1-100)"
            tags="${tags},branch-${branch_tag}"

            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              tags="${tags},latest"
            fi
          fi

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish dev container
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.IMAGE_NAME }}
          imageTag: ${{ steps.tags.outputs.tags }}
          cacheFrom: ${{ env.IMAGE_NAME }}
          push: ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
