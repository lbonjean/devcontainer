name: Build and publish dev container

on:
  push:
    branches: ['**']
    paths:
      - .devcontainer/**
      - .dockerignore
      - .github/workflows/**
      - .github/scripts/**
      - examples/powershell-7.6.5/function/**
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build dev container
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test workflow safeguards
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Check successful push tests for this PR commit
        if: github.event_name == 'pull_request'
        id: push-test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        run: python3 .github/scripts/check_push_test.py

      - name: Set lowercase image name
        if: steps.push-test.outputs.skip != 'true'
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Determine image tags
        if: steps.push-test.outputs.skip != 'true'
        id: tags
        shell: bash
        run: |
          tags="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            branch="${GITHUB_REF#refs/heads/}"
            branch_tag="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g' | cut -c1-100)"
            tags="${tags},branch-${branch_tag}"

            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              tags="${tags},latest"
            elif [[ "${GITHUB_REF}" == "refs/heads/staging" ]]; then
              tags="${tags},staging"
            fi
          fi

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        if: steps.push-test.outputs.skip != 'true'
        shell: bash
        run: |
          docker build --pull --no-cache --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -f .devcontainer/Dockerfile -t devcontainer:test .

      - name: Test image before publishing
        if: steps.push-test.outputs.skip != 'true'
        shell: bash
        run: docker run --rm --user vscode --mount "type=bind,source=${GITHUB_WORKSPACE},target=/src,readonly" devcontainer:test bash /src/.devcontainer/test-image.sh

      - name: Publish tested image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra tags <<< "$IMAGE_TAGS"
          for tag in "${tags[@]}"; do
            docker tag devcontainer:test "${IMAGE_NAME}:${tag}"
            docker push "${IMAGE_NAME}:${tag}"
          done
          docker buildx imagetools inspect "${IMAGE_NAME}:${tags[0]}" >> "$GITHUB_STEP_SUMMARY"
